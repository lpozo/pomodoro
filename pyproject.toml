[project]
name = "pomodoro"
version = "0.1.0"
description = "Simple Pomodoro Timer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Pomodoro developer", email = "you@example.com" }
]
dependencies = []

[project.scripts]
pomodoro = "pomodoro.__main__:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
